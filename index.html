<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои проекты</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 10px;
            background-color: #f4f4f4;
        }
        header, footer {
            text-align: center;
            margin-bottom: 30px;
        }
        .project {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            background-color: #fff;
        }
        h1, h2, h3 {
            margin: 5px 0;
        }
        /* Адаптивное видео */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Соотношение сторон 16:9 */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            margin-top: 10px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<header>
    <h1>Тешебаев Алихан</h1>
    <p>27 школа</p>
</header>

<main>
    <h2>Мои проекты</h2>

    <div class="project">
        <h3>Проект 1</h3>
        <p>Описание первого проекта (Пример видео)</p>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <div class="project">
        <h3>Проект 2</h3>
        <p>Описание второго проекта (Пример видео)</p>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/jNQXAC9IVRw" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 Тешебаев Алихан</p>
</footer>

</body>
</html>
