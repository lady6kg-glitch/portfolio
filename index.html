<!DOCTYPE html>

        body {

            margin: 20px auto;

        header, footer {
            text-align: center;
            margin-bottom: 30px;
        }
        .project {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
        }
        h1, h2, h3 {

        }
        /* Адаптивное видео */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            max-width: 100%;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

</head>

            <iframe src="https://www.youtube.com/embed/ИД_ВИДЕО_1" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Проект 2 -->
