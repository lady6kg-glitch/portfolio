<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои проекты</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 10px;
            background-color: #f9f9f9;
        }
        header, footer {
            text-align: center;
            margin-bottom: 30px;
        }
        .project {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 12px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            margin: 10px 0;
            color: #333;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            border-radius: 8px;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<header>
    <h1>Тешебаев Алихан</h1>
    <p>27 школа</p>
</header>

<main>
    <h2 style="text-align: center;">Мои работы</h2>

    <div class="project">
        <h3>Первый проект</h3>
        <p>Краткое описание вашего первого видео-проекта.</p>
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/I7U4Ma6SICc" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <div class="project">
        <h3>Проект 2</h3>
        <p>Краткое описание вашего второго видео-проекта.</p>
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/n8aVS4ffUkk" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 Тешебаев Алихан</p>
</footer>

</body>
</html>
