<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои проекты</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 10px;
        }
        header, footer {
            text-align: center;
            margin-bottom: 30px;
        }
        .project {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
        }
        h1, h2, h3 {
            margin: 5px 0;
        }
        /* Адаптивное видео */
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
        }
        .video-container iframe,
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<header>
    <h1>Тешебаев Алихан</h1>
    <p>27 школа</p>
</header>

<main>
    <h2>Мои проекты</h2>

    <div class="project">
        <h3>Проект 1</h3>
        <p>Описание первого проекта</p>
        <a href="#" target="_blank">Посмотреть</a>
    </div>

    <div class="project">
        <h3>Проект с видео</h3>
        <p>Демонстрация моего проекта</p>
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/gkuCXE_H624" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <div class="project">
        <h3>Проект 2</h3>
        <p>Демонстрация моего второго проекта</p>
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/n8aVS4ffUkk" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</main>

<footer>
    <p>© 2026 Тешебаев Алихан</p>
</footer>

</body>
</html>
